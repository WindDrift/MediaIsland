name: Build for Misha

on:
  push:
    branches:
      - dev/ci-misha
    paths:
      - 'MediaIsland/**'
      - 'MediaIsland.Tests/**'
      - 'MediaIsland.Windows/**'
      - 'native/ttml-ffi/**'
      - 'native/audio-ffi/**'
      - '.github/workflows/build-misha.yml'
  workflow_dispatch:

jobs:
  build_app:
    runs-on: windows-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install the .NET Core workload
      - name: Install .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/ttml-ffi -> target
            native/audio-ffi -> target

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-misha-${{ hashFiles('**.*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-misha-

      - name: Test
        # --blame-hang：测试挂起 5 分钟后自动终止并指出挂起的测试，避免 job 无限挂死
        run: dotnet test --blame-hang --blame-hang-timeout 5m

      - name: Build
        run: pwsh -ep bypass ./Tools/Publish.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: |
            ./MediaIsland/cipx/*.cipx

      - name: Upload APP to release
        uses: ncipollo/release-action@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          artifacts: "./MediaIsland/cipx/*.cipx"
          draft: true
          bodyFile: ./MediaIsland/cipx/checksums.md
          token: ${{ secrets.GITHUB_TOKEN }}
